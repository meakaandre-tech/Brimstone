name: Build

on:
  push:
    branches: ["main", "package-3"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/ci.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "2000"]
            }
            tasks.register("dumpCompileClasspath") {
              doLast {
                def files = new LinkedHashSet()
                project.sourceSets.each { files.addAll(it.compileClasspath.files) }
                new File("/tmp/compile-cp.txt").text = files.join("\n")
              }
            }
          }
          GRADLE
          ./gradlew build --no-daemon -Dorg.gradle.console=plain -I /tmp/ci.gradle 2>&1 | tee build.log
          mkdir -p dist
          cp "$(ls build/libs/*.jar | grep -v sources | head -1)" dist/brimstone.jar
      - name: Dump game signatures and bytecode
        if: always()
        shell: bash
        run: |
          # .github/dump-signatures: javap -p of every game and Fabric API class; .github/dump-bytecode: javap -c of the
          # game classes whose names match a regex in that file (one per line). Facts for later packages' mixins.
          set +e +o pipefail
          mkdir -p /tmp/ci
          ./gradlew dumpCompileClasspath --no-daemon -q -I /tmp/ci.gradle >/dev/null 2>&1 || true
          cp /tmp/compile-cp.txt /tmp/ci/compile-cp.txt
          mcjars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
          echo "$mcjars" > /tmp/ci/mcjars.txt
          fabricjars=$(grep -E '/fabric-[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | tr '\n' ' ')
          if [ -f .github/dump-signatures ]; then
            jars="$mcjars $fabricjars"
            cp=$(echo $jars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u | sed 's#/#.#g' | grep -v 'package-info\|module-info' > /tmp/ci/classes.txt
            (xargs -a /tmp/ci/classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/javap-all.txt.gz
          fi
          if [ -f .github/dump-bytecode ]; then
            cp=$(echo $mcjars | tr ' ' ':')
            for j in $mcjars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u | sed 's#/#.#g' | grep -E -f .github/dump-bytecode > /tmp/bc-classes.txt || true
            cp /tmp/bc-classes.txt /tmp/ci/bytecode-classes.txt
            (xargs -a /tmp/bc-classes.txt -n 300 javap -p -s -c -constants -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/bytecode.txt.gz
          fi
          cp build.log /tmp/ci/build.log 2>/dev/null
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          ls -l build/libs > /tmp/ci/jars.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: /tmp/ci
      - uses: actions/upload-artifact@v4
        with:
          name: brimstone-jar
          path: dist/brimstone.jar
      - name: Build the CI-only lightmap pin mod
        shell: bash
        run: |
          # ci/pin-mod: loaded in every client run, vanilla and Brimstone alike (see its mixin); compiled against the
          # Mixin jar from the game's compile classpath, never published beyond this run's artifacts
          set -e
          mixin=$(grep -E '/sponge-mixin[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | head -1 || true)
          [ -n "$mixin" ] || mixin=$(find ~/.gradle/caches -name 'sponge-mixin*.jar' 2>/dev/null | grep -v sources | head -1 || true)
          echo "Mixin jar: $mixin"
          test -n "$mixin"
          mkdir -p /tmp/pin/classes /tmp/pin-out
          javac --release 21 -cp "$mixin" -d /tmp/pin/classes $(find ci/pin-mod/src -name '*.java')
          cp ci/pin-mod/fabric.mod.json ci/pin-mod/brimstone_ci_pin.mixins.json /tmp/pin/classes/
          (cd /tmp/pin/classes && jar cf /tmp/pin-out/ci-pin.jar .)
          unzip -l /tmp/pin-out/ci-pin.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ci-pin-jar
          path: /tmp/pin-out/ci-pin.jar

  siftec-world:
    # SIFTEC's server and CI world, built once per SIFTEC build and smoke-file change and shared by the SIFTEC runs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meakaandre-tech/SIFTEC
          path: siftec
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Cache key
        id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api repos/meakaandre-tech/SIFTEC/releases/tags/latest --jq '[.assets[] | "\(.name)=\(.id)"] | join(",")' | sha256sum | cut -c1-16 || echo none)
          files=$(cat siftec/.github/smoke-commands.txt siftec/.github/smoke-pack-mods siftec/.github/fetch-tb.py ci/siftec-world.sh gradle.properties | sha256sum | cut -c1-16)
          echo "key=siftec-world-$asset-$files" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: siftec-server
          key: ${{ steps.key.outputs.key }}
      - name: Build SIFTEC's server and CI world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/siftec-world.sh
      - name: Pack the server
        shell: bash
        run: tar cf siftec-server.tar siftec-server && ls -l siftec-server.tar
      - uses: actions/upload-artifact@v4
        with:
          name: siftec-server
          path: siftec-server.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siftec-world-logs
          path: /tmp/out

  core-world:
    # The core suite's server and world, generated once and shared by every core client run (see ci/core-world.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Cache key
        id: key
        shell: bash
        run: echo "key=core-world-$(cat ci/core-world.sh gradle.properties | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: core-server
          key: ${{ steps.key.outputs.key }}
      - name: Build the core server and world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/core-world.sh
      - name: Pack the server
        shell: bash
        run: tar cf core-server.tar core-server && ls -l core-server.tar
      - uses: actions/upload-artifact@v4
        with:
          name: core-server
          path: core-server.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-world-logs
          path: /tmp/out

  client:
    needs: [build, siftec-world, core-world]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [core, siftec]
        run: [vanilla-a, vanilla-b, vanilla-old, vanilla-vk, brimstone-full, brimstone-old, brimstone-vk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: brimstone-jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-pin-jar
          path: ci-pin
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'siftec'
        with:
          name: siftec-server
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'core'
        with:
          name: core-server
      - name: Run the client
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          RUN: ${{ matrix.run }}
          OUT: /tmp/out/${{ matrix.suite }}-${{ matrix.run }}
          BENCH_SECONDS: "20"
        run: |
          chmod +x gradlew
          if [ -f siftec-server.tar ]; then tar xf siftec-server.tar; fi
          if [ -f core-server.tar ]; then tar xf core-server.tar; fi
          bash ci/client-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.suite }}-${{ matrix.run }}
          path: /tmp/out

  compare:
    needs: [build, client]
    # also after a failed build, so its log (build/build.log) reaches ci-logs; compare then fails on the missing runs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: res-*
          path: /tmp/res
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: build-logs
          path: /tmp/ci/build
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: siftec-world-logs
          path: /tmp/ci/siftec-world
      - name: Compare pictures and counts
        id: compare
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages pillow numpy
          python3 ci/compare.py /tmp/res /tmp/ci/compare
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/ci/compare/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish logs, bench results and screenshots to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci/runs && { cp -r /tmp/res/* /tmp/ci/runs/ 2>/dev/null || echo 'no client results'; }
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "CI logs for ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Fail on a wrong picture or a rise in counts
        shell: bash
        run: test "${{ steps.compare.outputs.status }}" = "0"

  release:
    needs: [build, compare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brimstone-jar
          path: dist
      - name: Publish the jar as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          cp dist/brimstone.jar brimstone-26.3.jar
          gh release create latest brimstone-26.3.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "Brimstone (latest build)" --notes "Built from main at ${GITHUB_SHA}. Fabric 26.3, needs Fabric API. Package 0: measures only, draws exactly like vanilla."
