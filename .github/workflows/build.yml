name: Build

on:
  push:
    # every branch (design doc, Quick CI); not the ci-logs branches CI itself writes
    branches-ignore: ["ci-logs", "ci-logs-*"]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (otherwise quick mode on branches)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  mode:
    # Quick mode on branch pushes: the core suite with vanilla a, vanilla b and Brimstone on the old-GPU profile
    # (about 10 minutes). Full matrix on main, on a commit with [full] in its message (every pre-merge check) and on a
    # manual run. Each branch publishes its logs to its own ci-logs-<branch> branch.
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
      matrix: ${{ steps.m.outputs.matrix }}
      logs: ${{ steps.m.outputs.logs }}
    steps:
      - id: m
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          FULL_INPUT: ${{ github.event.inputs.full }}
        run: |
          mode=quick
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then mode=full; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_INPUT" != "false" ]; then mode=full; fi
          case "$MESSAGE" in *"[full]"*) mode=full;; esac
          if [ $mode = full ]; then
            # package 4b: two more core runs with only the bench-only jar, on plain Fabric and next to Sodium
            matrix='{"suite":["core","siftec"],"run":["vanilla-a","vanilla-b","vanilla-old","vanilla-vk","brimstone-full","brimstone-old","brimstone-vk","measure-full","measure-old","measure-vk"],"include":[{"suite":"core","run":"bench-plain"},{"suite":"core","run":"bench-sodium"}]}'
          else
            matrix='{"suite":["core"],"run":["vanilla-a","vanilla-b","brimstone-old"]}'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "logs=ci-logs-$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "CI mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/ci.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "2000"]
            }
            tasks.register("dumpCompileClasspath") {
              doLast {
                def files = new LinkedHashSet()
                project.sourceSets.each { files.addAll(it.compileClasspath.files) }
                new File("/tmp/compile-cp.txt").text = files.join("\n")
              }
            }
          }
          GRADLE
          ./gradlew build --no-daemon -Dorg.gradle.console=plain -I /tmp/ci.gradle 2>&1 | tee build.log
          mkdir -p dist
          v=$(grep '^mod_version' gradle.properties | sed 's/.*= *//')+$(grep '^minecraft_version' gradle.properties | sed 's/.*= *//')
          cp "build/libs/brimstone-$v.jar" dist/brimstone.jar
          # package 4b: the bench-only jar (brimstone-bench: /brimstone bench, counters, scenes; no Brimstone module)
          cp "build/libs/brimstone-bench-$v.jar" dist/brimstone-bench.jar
          unzip -l dist/brimstone-bench.jar | tail -1
      - name: Dump game signatures and bytecode
        if: always()
        shell: bash
        run: |
          # .github/dump-signatures: javap -p of every game and Fabric API class; .github/dump-bytecode: javap -c of the
          # game classes whose names match a regex in that file (one per line). Facts for later packages' mixins.
          # Nothing of Mojang's is published (design doc, Rules: Mojang code): the dumps and the class lists go to
          # /tmp/dumps, an Actions artifact kept for 1 day, never to the public ci-logs branch. /tmp/ci holds Brimstone's
          # own build log and jar list (only build.log reaches ci-logs).
          set +e +o pipefail
          mkdir -p /tmp/ci /tmp/dumps
          ./gradlew dumpCompileClasspath --no-daemon -q -I /tmp/ci.gradle >/dev/null 2>&1 || true
          mcjars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
          echo "$mcjars" > /tmp/mcjars.txt
          fabricjars=$(grep -E '/fabric-[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | tr '\n' ' ')
          if [ -f .github/dump-signatures ]; then
            jars="$mcjars $fabricjars"
            cp=$(echo $jars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u | sed 's#/#.#g' | grep -v 'package-info\|module-info' > /tmp/dumps/classes.txt
            (xargs -a /tmp/dumps/classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/dumps/javap-all.txt.gz
          fi
          if [ -f .github/dump-bytecode ]; then
            cp=$(echo $mcjars | tr ' ' ':')
            for j in $mcjars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u | sed 's#/#.#g' | grep -E -f .github/dump-bytecode > /tmp/dumps/bytecode-classes.txt || true
            (xargs -a /tmp/dumps/bytecode-classes.txt -n 300 javap -p -s -c -constants -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/dumps/bytecode.txt.gz
          fi
          cp build.log /tmp/ci/build.log 2>/dev/null
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          ls -l build/libs > /tmp/ci/jars.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: /tmp/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # game class dumps: kept for 1 day, never published (see the step above)
          name: game-dumps
          path: /tmp/dumps
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: brimstone-jar
          path: |
            dist/brimstone.jar
            dist/brimstone-bench.jar
      - name: Build the CI-only lightmap pin mod
        shell: bash
        run: |
          # ci/pin-mod: loaded in every client run, vanilla and Brimstone alike (see its mixin); compiled against the
          # Mixin jar from the game's compile classpath, never published beyond this run's artifacts
          set -e
          mixin=$(grep -E '/sponge-mixin[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | head -1 || true)
          [ -n "$mixin" ] || mixin=$(find ~/.gradle/caches -name 'sponge-mixin*.jar' 2>/dev/null | grep -v sources | head -1 || true)
          echo "Mixin jar: $mixin"
          test -n "$mixin"
          mkdir -p /tmp/pin/classes /tmp/pin-out
          # the game's compile classpath (and the game jars) too, so the pin mixins can name the game's types
          cp="$mixin:$(tr '\n' ':' < /tmp/compile-cp.txt):$(tr '\n' ':' < /tmp/mcjars.txt)"
          javac --release 25 -cp "$cp" -d /tmp/pin/classes $(find ci/pin-mod/src -name '*.java')
          cp ci/pin-mod/fabric.mod.json ci/pin-mod/*.mixins.json /tmp/pin/classes/
          (cd /tmp/pin/classes && jar cf /tmp/pin-out/ci-pin.jar .)
          unzip -l /tmp/pin-out/ci-pin.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ci-pin-jar
          path: /tmp/pin-out/ci-pin.jar

  siftec-world:
    # SIFTEC's server and CI world, built once per SIFTEC build and smoke-file change and shared by the SIFTEC runs
    # (full mode only)
    needs: [mode]
    if: needs.mode.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meakaandre-tech/SIFTEC
          path: siftec
          sparse-checkout: .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Cache key
        id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api repos/meakaandre-tech/SIFTEC/releases/tags/latest --jq '[.assets[] | "\(.name)=\(.id)"] | join(",")' | sha256sum | cut -c1-16 || echo none)
          files=$(cat siftec/.github/smoke-commands.txt siftec/.github/smoke-pack-mods siftec/.github/fetch-tb.py ci/siftec-world.sh gradle.properties | sha256sum | cut -c1-16)
          echo "key=siftec-world-$asset-$files" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: siftec-server
          key: ${{ steps.key.outputs.key }}
      - name: Build SIFTEC's server and CI world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/siftec-world.sh
      - name: Pack the server
        shell: bash
        run: tar cf siftec-server.tar siftec-server && ls -l siftec-server.tar
      - uses: actions/upload-artifact@v4
        with:
          name: siftec-server
          path: siftec-server.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siftec-world-logs
          path: /tmp/out

  core-world:
    # The core suite's server and world, generated once and shared by every core client run (see ci/core-world.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Cache key
        id: key
        shell: bash
        run: echo "key=core-world-$(cat ci/core-world.sh gradle.properties | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: core-server
          key: ${{ steps.key.outputs.key }}
      - name: Build the core server and world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/core-world.sh
      - name: Pack the server
        shell: bash
        run: tar cf core-server.tar core-server && ls -l core-server.tar
      - uses: actions/upload-artifact@v4
        with:
          name: core-server
          path: core-server.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-world-logs
          path: /tmp/out

  client:
    needs: [mode, build, siftec-world, core-world]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.core-world.result == 'success' && (needs.siftec-world.result == 'success' || needs.siftec-world.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # the mode job's matrix: suites core and siftec with every run (measure-*: Brimstone loaded with every module
      # off, so its bench measures vanilla's own draw calls and terrain GPU memory in the same run, package 3's
      # at-or-under-vanilla gates), or in quick mode core with vanilla-a, vanilla-b and brimstone-old
      matrix: ${{ fromJSON(needs.mode.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: brimstone-jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ci-pin-jar
          path: ci-pin
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'siftec'
        with:
          name: siftec-server
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'core'
        with:
          name: core-server
      - name: Run the client
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          RUN: ${{ matrix.run }}
          OUT: /tmp/out/${{ matrix.suite }}-${{ matrix.run }}
          BENCH_SECONDS: "20"
          # the bench-only runs (package 4b) bench these scenes only
          BENCH_SCENES: "spawn flythrough water_glass nether"
        run: |
          chmod +x gradlew
          if [ -f siftec-server.tar ]; then tar xf siftec-server.tar; fi
          if [ -f core-server.tar ]; then tar xf core-server.tar; fi
          bash ci/client-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.suite }}-${{ matrix.run }}
          path: /tmp/out

  compare:
    needs: [mode, build, client]
    # also after a failed build, so its log (build/build.log) reaches ci-logs; compare then fails on the missing runs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: res-*
          path: /tmp/res
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-logs
          path: /tmp/build-logs
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: siftec-world-logs
          path: /tmp/ci/siftec-world
      - name: Compare pictures and counts
        id: compare
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages pillow numpy
          CI_MODE="${{ needs.mode.outputs.mode }}" python3 ci/compare.py /tmp/res /tmp/ci/compare
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/ci/compare/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish logs, bench results and screenshots to the branch's ci-logs-<branch> branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci/runs && { cp -r /tmp/res/* /tmp/ci/runs/ 2>/dev/null || echo 'no client results'; }
          # Brimstone's own build log only: no game class dumps or lists on ci-logs (they are the 1-day game-dumps artifact)
          cp /tmp/build-logs/build.log /tmp/ci/build.log 2>/dev/null || echo 'no build log'
          rm -rf /tmp/ci/build
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ${{ needs.mode.outputs.mode }}" > /tmp/ci/commit.txt
          logs="${{ needs.mode.outputs.logs }}"
          cd /tmp/ci
          git init -q -b "$logs"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "CI logs for ${GITHUB_SHA} (${GITHUB_REF_NAME}, ${{ needs.mode.outputs.mode }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$logs"
      - name: Fail on a wrong picture or a rise in counts
        shell: bash
        run: test "${{ steps.compare.outputs.status }}" = "0"

  release:
    needs: [mode, build, compare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.mode.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brimstone-jar
          path: dist
      - name: Publish the jar as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          cp dist/brimstone.jar brimstone-26.3.jar
          # package 4b: the bench-only jar next to it (for comparing vanilla, Sodium and Brimstone, docs/laptop-bench.md)
          cp dist/brimstone-bench.jar brimstone-bench-26.3.jar
          gh release create latest brimstone-26.3.jar brimstone-bench-26.3.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "Brimstone (latest build)" --notes "Built from main at ${GITHUB_SHA}. Fabric 26.3, needs Fabric API. brimstone-26.3.jar: Brimstone (draws what vanilla draws, faster). brimstone-bench-26.3.jar: only /brimstone bench, its counters and scenes, with every Brimstone module left out; use it instead of Brimstone on plain Fabric or next to Sodium to compare them (docs/laptop-bench.md). Never both in one instance."
